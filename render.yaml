# ==============================================================================
# Namlatic Hotel Owner Portal – Render Infrastructure Blueprint
# ==============================================================================
# Declares the production Node.js Express backend service for Render.
# Reference: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: namlatic-hotel-backend
    runtime: node
    plan: free
    region: oregon # Standard Render free tier region (US West)
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: MEDIA_STORAGE_DRIVER
        value: cloudinary
      # The following sensitive credentials are set in the Render Dashboard
      # and marked sync: false to prevent leaking secrets in Git:
      - key: DATABASE_URL
        sync: false # Runtime application connection (namlatic_app restricted role)
      - key: CORS_ORIGIN
        value: https://namlatic-hotel.vercel.app
      - key: BACKEND_PROXY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: namlatic-hotel/hotels
